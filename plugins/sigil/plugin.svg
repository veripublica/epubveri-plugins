<?xml version="1.0" encoding="UTF-8"?>
<!-- epubveri — the icon Sigil shows in Manage Plugins and on the toolbar.
     Suggested by DNSB, MobileRead 374939 #16.

     Drawn as a filled tile rather than a line drawing on purpose: Sigil has a
     dark theme as well as a light one, and a bare outline in a single colour
     disappears into one of them. The tile carries its own background, so the
     mark reads the same either way. Everything is chunky for the same reason —
     the icon is shown at 16px in the plugin list. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="epubveri">
  <title>epubveri</title>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#1b5f7a"/>
  <path d="M20 12h17l9 9v30a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2z"
        fill="#ffffff"/>
  <path d="M37 12l9 9h-9z" fill="#a8c6d4"/>
  <path d="M22 34l7 8 15-18" fill="none" stroke="#2e9e5b" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
